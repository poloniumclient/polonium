<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polonium</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="bg"><div class="grid"></div><div class="glow"></div><div class="cubes"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="watermark">POLONIUM</div><div id="dvd"><svg width="120" height="34" viewBox="0 0 120 34"><rect x="1" y="1" width="118" height="32" fill="none" stroke="currentColor" stroke-width="2"/><text x="60" y="22" text-anchor="middle" font-family="Consolas,monospace" font-weight="900" font-size="14" letter-spacing="3" fill="currentColor">POLONIUM</text></svg></div></div>
<header id="top">
  <div class="logo"></div>
  <div class="top-right">
  <div class="nickbox">
    <label for="nick">nick</label>
    <input id="nick" placeholder="..." maxlength="16" spellcheck="false" autocomplete="off">
    <span id="nick-dot"></span>
  </div>
  <div class="winbtns">
    <button id="w-min" title="min"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <button id="w-max" title="max"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <button id="w-close" title="close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5"/></svg></button>
  </div>
  </div>
</header>

<main id="center">
  <div class="box">
    <div class="box-head">cheats?</div>
    <div id="cheats-seg">
      <button data-v="no" class="active"><i></i>Nah not today</button>
      <button data-v="yes"><i></i>Obviously Yes</button>
    </div>
  </div>

  <button id="play"><img id="play-head" src="https://minotar.net/helm/PoloniumUser/32.png" alt=""><span><b>PLAY</b><small id="play-sub">vanilla • 1.21</small></span></button>

  <div class="vers-label">versions</div>
  <div id="versions"><span class="loading">loading...</span></div>

  <div id="bar"><div></div></div>
  <div id="log">ready.</div>
  <div class="hint">right ctrl in game opens clickgui</div>
</main>

<footer id="status">
  <span id="st-java">java: ?</span>
  <span id="st-root">.polonium</span>
  <span id="st-ver">v0.1.0</span>
</footer>

<button id="settings-btn" title="settings">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<div id="settings-modal" class="hidden">
  <div class="modal-card">
    <div class="modal-head"><b>settings</b><button id="settings-close">x</button></div>
    <label class="lbl">theme</label>
    <div class="themes" id="themes">
      <button data-theme="polonium" class="active"><s class="sw1"></s>polonium</button>
      <button data-theme="midnight"><s class="sw2"></s>midnight</button>
      <button data-theme="ghost"><s class="sw3"></s>ghost</button>
    </div>
    <label class="lbl">ram <span>mb</span><input id="set-ram" type="number" value="4096" min="1024" max="16384" step="512"></label>
    <label class="lbl">java path <span>empty = auto</span><input id="set-java" placeholder="java" spellcheck="false"></label>
    <button id="set-save">save</button>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
